name: Deploy Daily Research Radar to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "content/**"
      - "config/**"
      - "daily_radar/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Enforce zero-binary & secret/confidentiality guardrails
        run: python -m daily_radar scan-secrets --target . --include-tests

      - name: Build 3-tier static site
        run: python -m daily_radar build-site --content-dir content --config-dir config --out-dir _site

      - name: Scan rendered HTML/JSON output before publishing
        run: python -m daily_radar scan-secrets --target _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 8
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
