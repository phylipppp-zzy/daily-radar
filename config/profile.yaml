site:
  title: "每日科研与业界情报雷达"
  subtitle: "GUI Agent RL · 开放世界与 OOD 检测 · 多模态与 RL 工程底座"
  public_base_url: "https://phylipppp-zzy.github.io/daily-radar"
  github_repo: "phylipppp-zzy/daily-radar"
  timezone: "Asia/Shanghai"
  push_time_cst: "10:00:00"
  pages_ready_deadline_cst: "09:58:00"
  hot_detail_years: 3

budgets:
  featured_min: 5
  featured_max: 10
  folded_min: 10
  folded_max: 20
  p1_relative_top_fraction: 0.10
  dedup_window_days: 7
  feedback_window_days: 60
  pain_point_min_chars: 45
  pain_point_max_chars: 60

sections:
  - id: "papers"
    title: "核心方向论文"
    short_label: "核心论文"
    description: "聚焦 GUI 智能体强化学习、开放世界视觉/OSSL/OOD 检测及高相关多模态底座论文"
  - id: "opensource"
    title: "开源权重与工程框架"
    short_label: "开源与框架"
    description: "追踪多模态基座权重、RL 训练框架与推理评测引擎的关键版本演进"
  - id: "industry"
    title: "业界官方博客与会议动态"
    short_label: "业界与会议"
    description: "覆盖头部实验室一手技术报告、精选个人通讯与顶会放榜专项追踪"

tracks:
  gui-rl:
    tier: "P0"
    display_label: "GUI-RL"
    title: "GUI Agent 强化学习与评测安全"
    zotero_tag: "topic:gui-rl"
    keywords:
      - "gui agent"
      - "computer use"
      - "computer-use"
      - "osworld"
      - "androidworld"
      - "androidcontrol"
      - "webarena"
      - "visualwebarena"
      - "windowsagentarena"
      - "screenspot"
      - "ui-tars"
      - "opencua"
      - "gui grounding"
      - "mobile agent"
      - "desktop agent"
      - "browser agent"
      - "trajectory reward"
      - "visual prompt injection"
      - "GUI智能体"
      - "电脑操作"
      - "桌面智能体"
      - "手机智能体"
      - "图形界面"
    subtopics:
      gui-online-rl:
        label: "GUI 在线/离线 RL"
        keywords: ["grpo", "ppo", "advantage", "online rl", "rollout", "credit assignment", "curriculum"]
      gui-verifier:
        label: "轨迹判分与过程奖励"
        keywords: ["verifier", "reward model", "judge", "evaluator", "process reward", "state verification"]
      gui-env:
        label: "可验证环境与轨迹合成"
        keywords: ["environment synthesis", "trajectory synthesis", "tutorial", "sandbox", "benchmark", "simulator"]
      gui-security:
        label: "GUI 攻防与控制安全"
        keywords: ["prompt injection", "hijack", "redteam", "ai control", "control monitor", "privacy", "deceptive", "popup"]

  ossl-ood:
    tier: "P0"
    display_label: "OSSL/OOD"
    title: "开放世界词表、半监督与 OOD 检测"
    zotero_tag: "topic:ossl-ood"
    keywords:
      - "open-set semi-supervised"
      - "out-of-distribution detection"
      - "ood detection"
      - "negative label"
      - "neglabel"
      - "iomatch"
      - "scomatch"
      - "openmatch"
      - "clipn"
      - "generalized category discovery"
      - "open-world semi-supervised"
      - "open-vocabulary ood"
      - "codebook"
      - "zero-shot ood"
      - "novel class discovery"
      - "unknown detection"
      - "分布外检测"
      - "开放集"
      - "开放世界视觉"
      - "开放世界半监督"
      - "未知类检测"
      - "广义类别发现"
      - "视觉码本"
    subtopics:
      open-world-vocab:
        label: "开放词表与码本对齐"
        keywords: ["negative label", "lexicon", "wordnet", "codebook", "vocabulary", "prompt", "clipn", "neglabel"]
      ossl-ood-core:
        label: "开放集半监督与未知检测"
        keywords: ["open-set semi-supervised", "ossl", "iomatch", "scomatch", "openmatch", "outlier", "fpr95", "auroc"]
      gcd-clustering:
        label: "广义类别发现与聚类"
        keywords: ["generalized category discovery", "gcd", "novel class discovery", "clustering"]

  vlm-infra:
    tier: "P1"
    display_label: "VLM/RL底座"
    title: "多模态后训练与 RL 基础设施"
    zotero_tag: "topic:vlm-infra"
    keywords:
      - "verl"
      - "openrlhf"
      - "vllm"
      - "sglang"
      - "trl"
      - "qwen-vl"
      - "qwen3-vl"
      - "qwen4"
      - "deepseek"
      - "molmo"
      - "multimodal rl"
      - "post-training"
      - "world model"
      - "kv cache"
      - "async rl"
      - "多模态大模型"
      - "强化学习框架"
      - "后训练"
      - "推理引擎"
      - "开源权重"
    subtopics:
      rl-framework:
        label: "RL 训练与并发调度框架"
        keywords: ["verl", "openrlhf", "trl", "async", "ppo", "grpo", "rollout"]
      inference-engine:
        label: "推理引擎与系统优化"
        keywords: ["vllm", "sglang", "kv cache", "cuda", "fp8", "megakernel"]
      multimodal-base:
        label: "多模态基座与业界前沿"
        keywords: ["qwen", "claude", "anthropic", "openai", "deepmind", "genie", "molmo", "dino"]

