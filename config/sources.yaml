# Declarative upstream sources for Daily Research Radar.
# Note: Broken Reddit RSS and unstable third-party WeChat forwarders are intentionally excluded.

rate_limits:
  default_per_host_interval_sec: 1.5
  arxiv_interval_sec: 3.1
  github_interval_sec: 1.2
  consecutive_failure_alert_days: 3
  max_age_days: 5

sources:
  # 1. Academic daily increments
  - id: "arxiv-gui-cua"
    name: "arXiv Daily (GUI Agent / Computer Use / RL)"
    kind: "arxiv_api"
    section: "papers"
    enabled: true
    url: "https://export.arxiv.org/api/query?search_query=(cat:cs.CV+OR+cat:cs.CL+OR+cat:cs.LG+OR+cat:cs.AI+OR+cat:cs.HC+OR+cat:cs.RO+OR+cat:cs.CR)+AND+(all:%22GUI+agent%22+OR+all:%22computer+use%22+OR+all:%22computer-use%22+OR+all:%22OSWorld%22+OR+all:%22AndroidWorld%22+OR+all:%22WebArena%22+OR+all:%22GUI+grounding%22+OR+all:%22mobile+agent%22+OR+all:%22desktop+agent%22+OR+all:%22browser+agent%22+OR+all:%22UI-TARS%22)&sortBy=submittedDate&sortOrder=descending&max_results=40"
    openalex_query: '"GUI agent" OR "computer use" OR "OSWorld" OR "AndroidWorld" OR "WebArena" OR "GUI grounding" OR "mobile agent" OR "desktop agent" OR "browser agent" OR "UI-TARS"'

  - id: "arxiv-ossl-ood"
    name: "arXiv Daily (Open-Set SSL / VLM OOD / GCD)"
    kind: "arxiv_api"
    section: "papers"
    enabled: true
    url: "https://export.arxiv.org/api/query?search_query=(cat:cs.CV+OR+cat:cs.LG+OR+cat:cs.AI+OR+cat:cs.CL+OR+cat:stat.ML)+AND+(all:%22open-set+semi-supervised%22+OR+all:%22out-of-distribution+detection%22+OR+all:%22generalized+category+discovery%22+OR+all:%22negative+label%22+OR+all:%22OOD+detection%22+OR+all:%22zero-shot+OOD%22+OR+all:%22open-world+semi-supervised%22+OR+all:%22novel+class+discovery%22+OR+all:%22open-vocabulary%22)&sortBy=submittedDate&sortOrder=descending&max_results=35"
    openalex_query: '"open-set semi-supervised" OR "out-of-distribution detection" OR "generalized category discovery" OR "negative label" OR "OOD detection" OR "zero-shot OOD" OR "open-world semi-supervised" OR "novel class discovery" OR "open-vocabulary"'

  - id: "hf-daily-papers"
    name: "Hugging Face Daily Papers"
    kind: "hf_daily_papers"
    section: "papers"
    enabled: true
    url: "https://huggingface.co/api/daily_papers"

