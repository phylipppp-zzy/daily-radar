# Declarative upstream sources for Daily Research Radar.
# Note: Broken Reddit RSS and unstable third-party WeChat forwarders are intentionally excluded.

rate_limits:
  default_per_host_interval_sec: 1.5
  arxiv_interval_sec: 3.1
  github_interval_sec: 1.2
  consecutive_failure_alert_days: 3
  max_age_days: 5

sources:
  # 1. Academic daily increments
  - id: "arxiv-gui-cua"
    name: "arXiv Daily (GUI Agent / Computer Use / RL)"
    kind: "arxiv_api"
    section: "papers"
    enabled: true
    url: "https://export.arxiv.org/api/query?search_query=(cat:cs.CV+OR+cat:cs.CL+OR+cat:cs.LG+OR+cat:cs.AI+OR+cat:cs.HC)+AND+(all:%22GUI+agent%22+OR+all:%22computer+use%22+OR+all:%22computer-use%22+OR+all:%22OSWorld%22+OR+all:%22AndroidWorld%22+OR+all:%22WebArena%22)&sortBy=submittedDate&sortOrder=descending&max_results=40"
    openalex_query: '"GUI agent" OR "computer use" OR "OSWorld" OR "AndroidWorld" OR "WebArena"'

  - id: "arxiv-ossl-ood"
    name: "arXiv Daily (Open-Set SSL / VLM OOD / GCD)"
    kind: "arxiv_api"
    section: "papers"
    enabled: true
    url: "https://export.arxiv.org/api/query?search_query=(cat:cs.CV+OR+cat:cs.LG)+AND+(all:%22open-set+semi-supervised%22+OR+all:%22out-of-distribution+detection%22+OR+all:%22generalized+category+discovery%22+OR+all:%22negative+label%22)&sortBy=submittedDate&sortOrder=descending&max_results=35"
    openalex_query: '"open-set semi-supervised" OR "out-of-distribution detection" OR "generalized category discovery" OR "negative label"'

  - id: "hf-daily-papers"
    name: "Hugging Face Daily Papers"
    kind: "hf_daily_papers"
    section: "papers"
    enabled: true
    url: "https://huggingface.co/api/daily_papers"

  # 2. Open-source weights, GitHub Trending & core RL/inference framework releases
  - id: "gh-trending-python"
    name: "GitHub Trending (Python Daily)"
    kind: "github_trending"
    section: "opensource"
    enabled: true
    url: "https://github.com/trending/python?since=daily"

  - id: "gh-release-verl"
    name: "GitHub Releases: verl-project/verl"
    kind: "github_releases"
    section: "opensource"
    repo: "verl-project/verl"
    enabled: true
    url: "https://api.github.com/repos/verl-project/verl/releases?per_page=5"

  - id: "gh-release-openrlhf"
    name: "GitHub Releases: OpenRLHF/OpenRLHF"
    kind: "github_releases"
    section: "opensource"
    repo: "OpenRLHF/OpenRLHF"
    enabled: true
    url: "https://api.github.com/repos/OpenRLHF/OpenRLHF/releases?per_page=5"

  - id: "gh-release-vllm"
    name: "GitHub Releases: vllm-project/vllm"
    kind: "github_releases"
    section: "opensource"
    repo: "vllm-project/vllm"
    enabled: true
    url: "https://api.github.com/repos/vllm-project/vllm/releases?per_page=5"

  - id: "gh-release-sglang"
    name: "GitHub Releases: sgl-project/sglang"
    kind: "github_releases"
    section: "opensource"
    repo: "sgl-project/sglang"
    enabled: true
    url: "https://api.github.com/repos/sgl-project/sglang/releases?per_page=5"

  - id: "gh-release-trl"
    name: "GitHub Releases: huggingface/trl"
    kind: "github_releases"
    section: "opensource"
    repo: "huggingface/trl"
    enabled: true
    url: "https://api.github.com/repos/huggingface/trl/releases?per_page=5"

  - id: "gh-release-osworld"
    name: "GitHub Releases: xlang-ai/OSWorld"
    kind: "github_releases"
    section: "opensource"
    repo: "xlang-ai/OSWorld"
    enabled: true
    url: "https://api.github.com/repos/xlang-ai/OSWorld/releases?per_page=5"

  # 3. Official industry lab blogs & high-signal researcher newsletters
  - id: "blog-anthropic"
    name: "Anthropic Research & Engineering"
    kind: "rss"
    section: "industry"
    org: "Anthropic"
    enabled: true
    url: "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_research.xml"
    extra_urls:
      - "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_engineering.xml"
      - "https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml"

  - id: "blog-openai"
    name: "OpenAI News & Research"
    kind: "rss"
    section: "industry"
    org: "OpenAI"
    enabled: true
    url: "https://openai.com/news/rss.xml"

  - id: "blog-deepmind"
    name: "Google DeepMind Blog"
    kind: "rss"
