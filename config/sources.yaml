    kind: "rss"
    section: "industry"
    org: "Hugging Face"
    enabled: true
    url: "https://huggingface.co/blog/feed.xml"

  - id: "blog-karpathy"
    name: "Andrej Karpathy Blog"
    kind: "rss"
    section: "industry"
    org: "Andrej Karpathy"
    enabled: true
    url: "https://karpathy.github.io/feed.xml"

  - id: "blog-epoch-ai"
    name: "Epoch AI Research & Compute Trends"
    kind: "rss"
    section: "industry"
    org: "Epoch AI"
